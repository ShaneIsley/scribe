[package]
name = "scribe"
version = "1.0.0"
edition = "2021"
authors = ["Scribe Contributors"]
description = "A high-performance Git history database extractor"
license = "MIT OR Apache-2.0"

[lib]
name = "scribe"
path = "src/lib.rs"

[[bin]]
name = "scribe"
path = "src/main.rs"

[dependencies]
# Git operations
gix = "0.66"

# Database
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Parallelism
rayon = "1.10"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# Error handling
anyhow = "1.0"

# Datetime
chrono = "0.4"

# Hashing
sha2 = "0.10"

# Transformations
jmespath = "0.3"

[dev-dependencies]
tempfile = "3.23"
